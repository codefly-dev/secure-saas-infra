name: release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  build:
    name: build artifact
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      digest: ${{ steps.hash.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
          cache: npm
      - name: Install
        run: npm ci
      - name: Build
        run: npm run build
      - name: Package artifact
        run: |
          tar --owner=0 --group=0 --numeric-owner \
              -czf secure-saas-infra-${{ github.ref_name }}.tar.gz \
              dist policy package.json package-lock.json README.md docs gitops
      - name: Generate hash for SLSA provenance
        id: hash
        run: |
          set -euo pipefail
          digest=$(sha256sum secure-saas-infra-${{ github.ref_name }}.tar.gz | base64 -w0)
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: secure-saas-infra-${{ github.ref_name }}
          path: secure-saas-infra-${{ github.ref_name }}.tar.gz
          if-no-files-found: error
          retention-days: 30

  provenance:
    needs: build
    permissions:
      contents: read
      actions: read
      id-token: write
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: ${{ needs.build.outputs.digest }}
      upload-assets: false
      provenance-name: secure-saas-infra-${{ github.ref_name }}.intoto.jsonl

  publish:
    needs: [build, provenance]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    environment: production
    steps:
      - name: Download artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: secure-saas-infra-${{ github.ref_name }}
      - name: Download provenance
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ needs.provenance.outputs.provenance-name }}
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --notes "Signed SLSA Level 3 release. Verify provenance with slsa-verifier." \
            secure-saas-infra-${{ github.ref_name }}.tar.gz \
            ${{ needs.provenance.outputs.provenance-name }}
