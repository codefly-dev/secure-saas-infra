name: review-promotion

on:
  pull_request:
    paths:
      - security/adversarial-review-disposition.json
  push:
    branches:
      - main
    paths:
      - security/adversarial-review-disposition.json

permissions:
  contents: read

jobs:
  evidence-only:
    name: evidence-only promotion
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact reviewed head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.18.0"
          cache: npm
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.0"
          cache: false
      - name: Install exact npm version
        run: npm install --global npm@11.16.0
      - name: Install exact Pulumi CLI
        uses: pulumi/actions@8e5e406f4007fca908480587cb9893c07090f58d # v7
        with:
          pulumi-version: "3.253.0"
      - name: Verify exact toolchain
        run: |
          test "$(node --version)" = "v24.18.0"
          test "$(npm --version)" = "11.16.0"
          test "$(pulumi version)" = "v3.253.0"
          test "$(go version | awk '{print $3}')" = "go1.26.5"
      - name: Install exact locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Require an approved evidence-only child of the reviewed source
        env:
          DEUS_REVIEW_BASE_REVISION: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node scripts/verify-review-promotion.mjs
      - name: Re-run source qualification on the exact evidence child
        run: npm run validate:source
      - name: Emit explicitly unqualified source-release evidence
        run: >-
          npm run evidence:release --
          --require-clean
          --output artifacts/security-contract-evidence.json
      - name: Upload source-promotion evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: secure-saas-infra-promotion-evidence
          path: |
            artifacts/secure-saas-infra.spdx.json
            artifacts/security-contract-evidence.json
            artifacts/contract-schema-validation.json
          if-no-files-found: error
          retention-days: 30
