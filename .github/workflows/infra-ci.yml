name: infra-ci

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: source qualification (${{ matrix.architecture }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            runner: ubuntu-24.04
          - architecture: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.18.0"
          cache: npm
      - name: Setup Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: "1.26.5"
          cache: false
      - name: Install exact npm version
        run: npm install --global npm@11.16.0
      - name: Install exact Pulumi CLI
        uses: pulumi/actions@8e5e406f4007fca908480587cb9893c07090f58d # v7
        with:
          pulumi-version: "3.253.0"
      - name: Verify exact toolchain
        run: |
          test "$(node --version)" = "v24.18.0"
          test "$(npm --version)" = "11.16.0"
          test "$(pulumi version)" = "v3.253.0"
          test "$(go version | awk '{print $3}')" = "go1.26.5"
      - name: Verify source, tests, audit, and SBOM without promotion evidence
        run: npm run validate:source
      - name: Upload dependency SBOM and contract validation
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: secure-saas-infra-sbom-${{ matrix.architecture }}
          path: |
            artifacts/secure-saas-infra.spdx.json
            artifacts/contract-schema-validation.json
            artifacts/management-seed-test-results.json
            artifacts/management-seed-test-results.junit.xml
          if-no-files-found: error
          retention-days: 30

  provider-smoke:
    name: exact AWS provider smoke (${{ matrix.architecture }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            runner: ubuntu-24.04
            machine: x86_64
          - architecture: arm64
            runner: ubuntu-24.04-arm
            machine: aarch64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - name: Checkout without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Setup exact Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.18.0"
      - name: Setup exact Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: "1.26.5"
          cache: false
      - name: Setup exact Pulumi CLI
        uses: pulumi/actions@8e5e406f4007fca908480587cb9893c07090f58d # v7
        with:
          pulumi-version: "3.253.0"
      - name: Vet and test the native launcher on this architecture
        run: |
          test "$(go version | awk '{print $3}')" = "go1.26.5"
          go vet ./cmd/deus-aws-bootstrap
          go test ./cmd/deus-aws-bootstrap
      - name: Download and verify the exact provider archive
        env:
          EXPECTED_MACHINE: ${{ matrix.machine }}
        run: |
          node_path=$(command -v node)
          pulumi_path=$(command -v pulumi)
          test "$(uname -m)" = "$EXPECTED_MACHINE"
          env -i HOME="$RUNNER_TEMP/provider-smoke-home" LANG=C PATH=/usr/bin:/bin \
            "$node_path" scripts/prepare-bootstrap-plugins.mjs --pulumi "$pulumi_path"
          provider=artifacts/bootstrap-pulumi-home/plugins/resource-aws-v7.27.0/pulumi-resource-aws
          test -x "$provider"
          test "$(env -i HOME="$RUNNER_TEMP/provider-smoke-home" LANG=C "$provider" --version)" = "7.27.0"
